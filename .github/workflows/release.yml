# Versioning and publishing, driven by changesets.
#
# Two paths, both starting from a push to main:
#
#  1. Changeset files are pending -> the action opens (or updates) a "Version
#     Packages" PR that bumps the version and writes CHANGELOG.md. Nothing is
#     published. Merging that PR is the decision to release.
#  2. That PR has just been merged, so no changesets remain -> the action publishes
#     what the merge produced.
#
# The version is never edited by hand. `changeset version` owns apps/cli/package.json,
# and tsup injects that value into the binary, so the two cannot drift.
#
# While `.changeset/pre.json` exists the repo is in prerelease mode: versions come
# out as 0.1.0-alpha.N and publish under the `alpha` dist-tag, leaving `latest`
# alone. `pnpm changeset pre exit` ends that and the next release is stable.
name: Release

on:
  # Chained to CI rather than to the push itself. Both used to fire on every push to
  # main, so the whole suite ran twice in parallel — and worse, a release could start
  # while CI was still deciding whether the commit was good.
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # vercel/ai filters this workflow with `paths: ['.changeset/**']` so it only wakes
  # for a release. That key belongs to `push` and is unavailable on `workflow_run`,
  # so the equivalent lives here — a cheap checkout that decides whether the real job
  # runs at all, instead of installing a toolchain to discover there is no work.
  pending:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'vietnamesekid/issueforge'
      && (github.event_name == 'workflow_dispatch'
          || github.event.workflow_run.conclusion == 'success')
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - id: check
        # In prerelease mode a changeset that has already been versioned STAYS on
        # disk and is recorded in pre.json instead, so counting *.md files reports
        # pending work forever — verified against this repo, where the one consumed
        # changeset made a naive count say "true" while `changeset status` said there
        # was nothing to bump. Only files absent from pre.json count.
        run: node scripts/pending-changesets.mjs >> "$GITHUB_OUTPUT"

  release:
    needs: pending
    if: needs.pending.outputs.found == 'true'
    runs-on: ubuntu-latest
    permissions:
      # OIDC trusted publishing and the provenance attestation. Without id-token the
      # publish still succeeds but ships NO attestation, and that is invisible until
      # someone looks at the package page.
      id-token: write
      # The action commits the version bump and opens the release PR.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets needs history to work out what changed since the last tag.
          fetch-depth: 0
          # workflow_run starts from the default branch, not the commit that
          # triggered CI, so the SHA has to be named explicitly or a release could
          # version a different tree than the one that passed.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Trusted publishing needs npm >=11.5.1; the runner's bundled npm can lag, and
      # an older one fails with a confusing auth error rather than naming the cause.
      - run: npm install -g npm@latest

      # No `pnpm check` here: this run is gated on a green CI for the same commit, so
      # repeating the suite would double every push for no new information. The one
      # thing CI cannot cover is the tarball built from the BUMPED manifest, and
      # `ci:release` rebuilds before `changeset publish` for exactly that reason.

      - uses: changesets/action@v2
        id: changesets
        with:
          version: pnpm ci:version
          publish: pnpm ci:release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Provenance is opt-in per publish; changeset publish honours this env var.
          NPM_CONFIG_PROVENANCE: 'true'

      # `changeset publish` creates the git tags. A GitHub Release makes them
      # visible, and is skipped entirely when the run only opened the version PR.
      - name: Create GitHub Releases
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          echo "$PUBLISHED" | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              for (const p of JSON.parse(s || "[]")) {
                // Any version carrying a hyphen is a prerelease (0.1.0-alpha.3).
                const pre = p.version.includes("-") ? "--prerelease" : "";
                console.log(`gh release create v${p.version} --title v${p.version} --generate-notes ${pre} || true`);
              }
            });
          ' | sh
