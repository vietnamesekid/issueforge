name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is Active LTS and the primary target; 22.13 is the supported floor
        # (the version where node:sqlite stops needing a flag).
        node: ['24', '22.13']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `tsc --build` follows the project-reference graph and builds packages in
      # dependency order, so typecheck no longer needs a prior build step.
      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm lint

      # Includes the import-boundary check (fails CI on a dependency-direction
      # violation) and the cross-process race test, which runs against dist/.
      - run: pnpm test

      # Lints the PUBLISHED package, which no other step here can see: `pnpm check`
      # type-checks and runs the source, while what reaches a user is the tarball.
      # It packs the real thing and checks bin paths, exports and file layout —
      # exactly the class of defect that shipped a bin npm silently strips.
      - run: pnpm --filter issueforge exec publint

      # Coverage runs on one matrix leg only: the number is identical across Node
      # versions, and two legs writing the same badge would race.
      - name: Coverage
        if: matrix.node == '24'
        run: pnpm test:coverage

      # Fails the build if coverage drops below the floor. A badge that only reports
      # is decorative; the floor is what actually protects the number. Raise it as
      # coverage improves — never lower it to make a red build green.
      - name: Enforce coverage floor
        if: matrix.node == '24'
        run: node scripts/check-coverage.mjs 78

      - name: CLI smoke test
        run: node apps/cli/dist/main.js --help
